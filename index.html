
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova Appointment Reminder</title>
  
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "8baed0da-d07a-444d-8749-d74a8532b31b",
    });
  });

    window.subscribeToNotifications = async function() {
      const message = document.getElementById('subscriptionMessage');
      const button = document.getElementById('subscribeButton');

      try {
        await OneSignal.Notifications.requestPermission();
        await OneSignal.User.PushSubscription.optIn();

       message.textContent = OneSignal.User.PushSubscription.optedIn
  ? 'Notifications are enabled!'
  : 'Please check your notification permission and try again.';
        button.textContent = 'Subscription Requested';
      } catch (error) {
        message.textContent = 'Could not subscribe. Please refresh the page and try again.';
        console.error(error);
      }
    };

</script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f6f3;
      color: #173b35;
      text-align: center;
      padding: 60px 20px;
    }
    main {
      max-width: 480px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
    }
    h1 { color: #173b35; }
    p { line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Nova Appointment Reminder</h1>
    <p>Your notification website is working.</p>
    <p>We're preparing your appointment alerts.</p>
    
<button id="subscribeButton" onclick="subscribeToNotifications()" style="background:#173b35;color:white;padding:14px 22px;border:0;border-radius:8px;font-size:16px;cursor:pointer;margin-top:16px;">
  Subscribe to Notifications
</button>
<p id="subscriptionMessage">Enable notifications to receive appointment alerts.</p>

  </main>
</body>
</html>
